[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reusable-operator-worlds"
version = "0.1.0"
description = "Controlled lifetime-learning benchmarks for reusable neural computation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "PyYAML>=6.0",
  "scipy>=1.14",
  "torch>=2.13,<3",
]

[project.scripts]
row-scratch-difficulty = "row.experiments.scratch_difficulty:main"

[tool.setuptools.packages.find]
where = ["src"]
